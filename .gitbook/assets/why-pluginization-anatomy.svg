<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
	<title id="title">每个业务模块，都负责一组完整的实现与资源</title>
	<desc id="desc">应用由交易、支付、物联模块组成。每个模块归集自己的模型、服务、事件或处理器、站点接入、清单、选项、映射及资源，并包含相应产品扩展、支付提供者或设备协议。改编自 Hiisea 的 micro-domain.png，按服务端插件组织替换前端职责。</desc>
