		<rect x="70" y="557" width="344" height="193" rx="16" fill="#E6F4EF" stroke="none" />
		<text x="90" y="594" font-size="24" fill="#287C68" font-weight="650" text-anchor="start" >交易模块</text>
		<rect x="86" y="614" width="152" height="43" rx="10" fill="#FFFFFF" stroke="none" />
