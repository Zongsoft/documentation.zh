		<rect x="444" y="614" width="152" height="43" rx="10" fill="#FFFFFF" stroke="none" />
		<text x="520.0" y="642.85" font-size="21" fill="#5367A1" font-weight="500" text-anchor="middle" >支付申请</text>
		<rect x="604" y="614" width="152" height="43" rx="10" fill="#FFFFFF" stroke="none" />
		<text x="680.0" y="642.85" font-size="21" fill="#5367A1" font-weight="500" text-anchor="middle" >支付确认</text>
		<rect x="444" y="668" width="152" height="43" rx="10" fill="#FFFFFF" stroke="none" />
		<text x="520.0" y="696.85" font-size="21" fill="#5367A1" font-weight="500" text-anchor="middle" >退款处理</text>
		<rect x="604" y="668" width="152" height="43" rx="10" fill="#FFFFFF" stroke="none" />
		<text x="680.0" y="696.85" font-size="21" fill="#5367A1" font-weight="500" text-anchor="middle" >通道适配</text>
		<rect x="786" y="557" width="344" height="193" rx="16" fill="#FFF3DF" stroke="none" />
		<text x="806" y="594" font-size="24" fill="#9C712F" font-weight="650" text-anchor="start" >物联模块</text>
		<rect x="802" y="614" width="152" height="43" rx="10" fill="#FFFFFF" stroke="none" />
		<text x="878.0" y="642.85" font-size="21" fill="#9C712F" font-weight="500" text-anchor="middle" >设备注册</text>
		<rect x="962" y="614" width="152" height="43" rx="10" fill="#FFFFFF" stroke="none" />
		<text x="1038.0" y="642.85" font-size="21" fill="#9C712F" font-weight="500" text-anchor="middle" >发送指令</text>
		<rect x="802" y="668" width="152" height="43" rx="10" fill="#FFFFFF" stroke="none" />
		<text x="878.0" y="696.85" font-size="21" fill="#9C712F" font-weight="500" text-anchor="middle" >上报状态</text>
		<rect x="962" y="668" width="152" height="43" rx="10" fill="#FFFFFF" stroke="none" />
		<text x="1038.0" y="696.85" font-size="21" fill="#9C712F" font-weight="500" text-anchor="middle" >协议解析</text>
		<text x="48" y="818" font-size="19" fill="#60758A" font-weight="400" text-anchor="start" >改变的是责任边界；模块之间仍需通过明确契约协作。</text>
