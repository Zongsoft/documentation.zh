		<text x="270.0" y="232.0" font-size="20" fill="#287C68" font-weight="500" text-anchor="middle" >创建订单</text>
		<rect x="386" y="205" width="208" height="40" rx="10" fill="#ECF0FB" stroke="none" />
		<text x="490.0" y="232.0" font-size="20" fill="#5367A1" font-weight="500" text-anchor="middle" >支付确认</text>
		<rect x="606" y="205" width="208" height="40" rx="10" fill="#FFF3DF" stroke="none" />
		<text x="710.0" y="232.0" font-size="20" fill="#9C712F" font-weight="500" text-anchor="middle" >设备注册</text>
		<rect x="826" y="205" width="208" height="40" rx="10" fill="#E6F4EF" stroke="none" />
		<text x="930.0" y="232.0" font-size="20" fill="#287C68" font-weight="500" text-anchor="middle" >订单结算</text>
		<rect x="166" y="262" width="208" height="40" rx="10" fill="#FFF3DF" stroke="none" />
		<text x="270.0" y="289.0" font-size="20" fill="#9C712F" font-weight="500" text-anchor="middle" >发送指令</text>
		<rect x="386" y="262" width="208" height="40" rx="10" fill="#E6F4EF" stroke="none" />
		<text x="490.0" y="289.0" font-size="20" fill="#287C68" font-weight="500" text-anchor="middle" >计算金额</text>
		<rect x="606" y="262" width="208" height="40" rx="10" fill="#ECF0FB" stroke="none" />
		<text x="710.0" y="289.0" font-size="20" fill="#5367A1" font-weight="500" text-anchor="middle" >支付申请</text>
		<rect x="826" y="262" width="208" height="40" rx="10" fill="#FFF3DF" stroke="none" />
		<text x="930.0" y="289.0" font-size="20" fill="#9C712F" font-weight="500" text-anchor="middle" >上报状态</text>
