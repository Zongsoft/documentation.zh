<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
	<title id="title">功能还是这些功能，变化有了各自的归属</title>
	<desc id="desc">上方：创建订单、确认支付、发送指令等十二项职责散落在同一应用中。下方：同样的职责归入交易、支付、物联三个业务模块，应用边界保持不变。</desc>
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#718698" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
		<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#18354B" flood-opacity="0.06"/></filter>
	</defs>
	<g font-family="'Segoe UI', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif">
		<rect x="0" y="0" width="1200" height="850" rx="0" fill="#F6F8FB" stroke="none" />
		<text x="48" y="60" font-size="32" fill="#21364A" font-weight="700" text-anchor="start" >功能还是这些功能，变化有了各自的归属</text>
		<text x="48" y="97" font-size="20" fill="#60758A" font-weight="400" text-anchor="start" >按业务聚合相关功能，让一次变化有明确的负责人</text>
