	<title id="title">宿主承载，模块分工，内部继续分层</title>
	<desc id="desc">宿主提供进程、配置与生命周期，分别承载交易、支付、物联模块。每个模块内部依次为入口适配、业务规则、数据与资源。虚线表示承载与装配，实线表示模块内部调用方向。</desc>
