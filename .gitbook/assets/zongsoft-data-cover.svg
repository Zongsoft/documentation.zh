<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
	<title id="title">Data engine cover</title>
	<desc id="desc">Data engine layers from schema to driver and database.</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0f172a"/>
			<stop offset="0.45" stop-color="#0f766e"/>
			<stop offset="1" stop-color="#ca8a04"/>
		</linearGradient>
	</defs>
	<rect width="1200" height="420" rx="26" fill="url(#bg)"/>
	<g transform="translate(90 74)" font-family="Segoe UI, Arial, sans-serif">
		<text x="0" y="0" fill="#ffffff" font-size="34" font-weight="700">Describe data shape, not SQL scripts</text>
		<g transform="translate(0 62)">
			<rect width="228" height="188" rx="18" fill="#ecfeff" fill-opacity="0.96"/>
			<rect x="264" width="228" height="188" rx="18" fill="#f0fdf4" fill-opacity="0.96"/>
			<rect x="528" width="228" height="188" rx="18" fill="#fffbeb" fill-opacity="0.96"/>
			<rect x="792" width="228" height="188" rx="18" fill="#f8fafc" fill-opacity="0.96"/>
			<path d="M228 94 H264 M492 94 H528 M756 94 H792" stroke="#d1fae5" stroke-width="8" stroke-linecap="round"/>
			<g fill="#0f172a" font-weight="700" font-size="22">
				<text x="32" y="58">Schema</text>
				<text x="296" y="58">Mapping</text>
				<text x="560" y="58">IDataAccess</text>
				<text x="824" y="58">Driver</text>
			</g>
			<g fill="#334155" font-size="17">
				<text x="32" y="104">*, Roles{Name}</text>
				<text x="296" y="104">entity, table, relation</text>
				<text x="560" y="104">query, write, aggregate</text>
				<text x="824" y="104">MySQL, SQLite, PG</text>
			</g>
		</g>
	</g>
</svg>
