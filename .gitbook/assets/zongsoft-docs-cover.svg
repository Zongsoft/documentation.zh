<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
	<title id="title">Zongsoft documentation cover</title>
	<desc id="desc">Abstract documentation cover with modules, host, plugin, data and tools layers.</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0f172a"/>
			<stop offset="0.45" stop-color="#164e63"/>
			<stop offset="1" stop-color="#14532d"/>
		</linearGradient>
		<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0.26"/>
			<stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
		</linearGradient>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.28"/>
		</filter>
	</defs>
	<rect width="1440" height="520" rx="28" fill="url(#bg)"/>
	<g opacity="0.24" stroke="#d9f99d" stroke-width="2">
		<path d="M0 392 C210 316 300 442 520 354 S870 238 1090 306 1290 414 1440 336" fill="none"/>
		<path d="M0 170 C220 98 340 220 548 156 S930 104 1132 170 1306 246 1440 206" fill="none"/>
	</g>
	<g transform="translate(112 76)">
		<rect width="520" height="312" rx="22" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.26" filter="url(#shadow)"/>
		<text x="42" y="78" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="700">Zongsoft Docs</text>
		<text x="42" y="124" fill="#d1fae5" font-family="Segoe UI, Arial, sans-serif" font-size="21">Pluginized .NET framework, hosting and tools</text>
		<g transform="translate(42 174)" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#f8fafc">
			<rect width="146" height="48" rx="12" fill="#22c55e" fill-opacity="0.22" stroke="#86efac" stroke-opacity="0.55"/>
			<text x="22" y="31">Framework</text>
			<rect x="166" width="108" height="48" rx="12" fill="#38bdf8" fill-opacity="0.18" stroke="#7dd3fc" stroke-opacity="0.55"/>
			<text x="190" y="31">Hosting</text>
			<rect x="294" width="82" height="48" rx="12" fill="#facc15" fill-opacity="0.18" stroke="#fde68a" stroke-opacity="0.55"/>
			<text x="319" y="31">Tools</text>
		</g>
	</g>
	<g transform="translate(760 84)" filter="url(#shadow)">
		<rect x="0" y="68" width="152" height="90" rx="18" fill="#ecfeff" fill-opacity="0.92"/>
		<rect x="246" y="0" width="152" height="90" rx="18" fill="#f0fdf4" fill-opacity="0.92"/>
		<rect x="246" y="212" width="152" height="90" rx="18" fill="#fff7ed" fill-opacity="0.92"/>
		<rect x="492" y="68" width="152" height="90" rx="18" fill="#f8fafc" fill-opacity="0.92"/>
		<path d="M152 113 H246 M322 90 V212 M398 45 H492 M398 257 H492" stroke="#bae6fd" stroke-width="8" stroke-linecap="round"/>
		<g font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f172a" text-anchor="middle" font-weight="600">
			<text x="76" y="122">Host</text>
			<text x="322" y="55">Plugins</text>
			<text x="322" y="267">Data</text>
			<text x="568" y="122">Apps</text>
		</g>
	</g>
</svg>
