<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
	<title id="title">Plugin framework cover</title>
	<desc id="desc">Plugin tree with extension points and modules.</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#111827"/>
			<stop offset="0.55" stop-color="#1d4ed8"/>
			<stop offset="1" stop-color="#7c3aed"/>
		</linearGradient>
	</defs>
	<rect width="1200" height="420" rx="26" fill="url(#bg)"/>
	<g transform="translate(98 80)">
		<text x="0" y="0" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Plugin tree as the runtime map</text>
		<g transform="translate(0 58)" stroke="#bfdbfe" stroke-width="6" stroke-linecap="round">
