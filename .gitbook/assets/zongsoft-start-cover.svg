<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
	<title id="title">Getting started cover</title>
	<desc id="desc">A clean setup path from local workspace to running host.</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#1e293b"/>
			<stop offset="0.55" stop-color="#0f766e"/>
			<stop offset="1" stop-color="#65a30d"/>
		</linearGradient>
	</defs>
	<rect width="1200" height="420" rx="26" fill="url(#bg)"/>
	<g transform="translate(94 74)" fill="none" stroke-linecap="round" stroke-linejoin="round">
